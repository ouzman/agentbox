# Publishes the base image (the one `agentbox build` makes) with UID/GID 1000,
# for consumers such as agentbox-k8s. The laptop build is unaffected.
name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          install: true # `docker build` -> buildx, so `agentbox build` can push multi-arch
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          AGENTBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/agentbox:${{ github.ref_name }}
          AGENTBOX_UID: '1000'
          AGENTBOX_GID: '1000'
        run: |
          ./agentbox build --platform linux/amd64,linux/arm64 --pull --push \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }}
